<text x="72" y="48" font-size="16" font-weight="700" letter-spacing="2" fill="#2b7777">J.A.R.V.I.S. / EDUCATIONAL VISUAL SERIES</text>
<text x="72" y="112" font-size="52" font-weight="800" fill="#2b3134">ELEMENT DISCOVERY &amp; PERIODIC-TABLE</text>
<text x="72" y="172" font-size="52" font-weight="800" fill="#2b3134">ORGANIZATION</text>
<text x="74" y="232" font-size="21" fill="#4e524e">10 selected elements · from 1774 to 2009–2010</text>
<text x="74" y="260" font-size="14" fill="#796f60">Element discovery transformed chemistry: from identifying substances in minerals and gases to detecting atoms made in laboratories.</text>
<rect x="72" y="320" width="684" height="297" rx="12" fill="#fffdf4" stroke="#2b7777" stroke-width="2"/>
<text x="92" y="354" font-size="13" font-weight="700" fill="#2b7777">1774 · first production</text><text x="92" y="375" font-size="10" fill="#796f60">Cl / ATOMIC NO. </text><text x="92" y="401" font-size="21" font-weight="750" fill="#2b3134">Chlorine</text>
<path d="M669 378h26m-7 0v34l25 38v8h-62v-8l25-38v-34" fill="#16394a" stroke="#2b7777" stroke-width="4"/><path d="M655 435h54l14 25h-82z" fill="#397e69" opacity=".9"/><g fill="none" stroke="#dceff5" stroke-width="3"><circle cx="658" cy="372" r="5"/><circle cx="686" cy="361" r="4"/><circle cx="706" cy="373" r="6"/></g>
<text x="92" y="425" font-size="11" font-weight="650" fill="#2b7777">Carl Wilhelm Scheele · Uppsala, Sweden · Scheele’s laboratory and</text>
<text x="92" y="439" font-size="11" font-weight="650" fill="#2b7777">pharmacy, Uppsala</text>
<text x="92" y="459" font-size="11" fill="#4e524e">Scheele produced greenish-yellow chlorine by heating hydrochloric acid with</text>
<text x="92" y="474" font-size="11" fill="#4e524e">pyrolusite. Humphry Davy later proved it was an element (1810).</text>
<rect x="780" y="320" width="684" height="297" rx="12" fill="#fffdf4" stroke="#b15b36" stroke-width="2"/>
<text x="800" y="354" font-size="13" font-weight="700" fill="#2b7777">1811 · first observed</text><text x="800" y="375" font-size="10" fill="#796f60">I / ATOMIC NO. </text><text x="800" y="401" font-size="21" font-weight="750" fill="#2b3134">Iodine</text>
<g fill="#3d2e69" stroke="#b891e8" stroke-width="3"><path d="M1348 447l8-58 18-25 8 83z"/><path d="M1380 447l11-68 20-23 5 91z"/><path d="M1408 447l12-42 14-10 5 52z"/></g><path d="M1356 389l12 57m16-54 10 54" stroke="#d9c4ff" stroke-width="2"/>
<text x="800" y="425" font-size="11" font-weight="650" fill="#b15b36">Bernard Courtois · Paris, France · Courtois’s saltpetre works and</text>
<text x="800" y="439" font-size="11" font-weight="650" fill="#b15b36">laboratory, Paris</text>
<text x="800" y="459" font-size="11" fill="#4e524e">Courtois saw violet vapour while processing seaweed ash. Gay-Lussac later named</text>
<text x="800" y="474" font-size="11" fill="#4e524e">the element after its violet colour.</text>
<rect x="72" y="635" width="684" height="297" rx="12" fill="#fffdf4" stroke="#2b7777" stroke-width="2"/>
<text x="92" y="669" font-size="13" font-weight="700" fill="#2b7777">1826 · discovery published</text><text x="92" y="690" font-size="10" fill="#796f60">Br / ATOMIC NO. </text><text x="92" y="716" font-size="21" font-weight="750" fill="#2b3134">Bromine</text>
<rect x="656" y="696" width="52" height="76" rx="10" fill="#183346" stroke="#2b7777" stroke-width="4"/><rect x="665" y="734" width="34" height="28" rx="4" fill="#ae4e27"/><rect x="670" y="682" width="24" height="17" rx="4" fill="#dceff5"/><path d="M665 734h34" stroke="#ffb162" stroke-width="3"/>
<text x="92" y="740" font-size="11" font-weight="650" fill="#2b7777">Antoine-Jérôme Balard · Montpellier, France · University of</text>
<text x="92" y="754" font-size="11" font-weight="650" fill="#2b7777">Montpellier</text>
<text x="92" y="774" font-size="11" fill="#4e524e">Balard identified an orange-red liquid in brine residues. Carl Löwig had</text>
<text x="92" y="789" font-size="11" fill="#4e524e">independently produced a sample in 1825.</text>
<rect x="780" y="635" width="684" height="297" rx="12" fill="#fffdf4" stroke="#b15b36" stroke-width="2"/>
<text x="800" y="669" font-size="13" font-weight="700" fill="#2b7777">1868 · solar detection</text><text x="800" y="690" font-size="10" fill="#796f60">He / ATOMIC NO. </text><text x="800" y="716" font-size="21" font-weight="750" fill="#2b3134">Helium</text>
<circle cx="1380" cy="723" r="35" fill="#ffbc53" stroke="#ffb162" stroke-width="3"/><line x1="1410" y1="705" x2="1455" y2="705" stroke="#64aeff" stroke-width="4"/><line x1="1410" y1="716" x2="1455" y2="716" stroke="#b891e8" stroke-width="4"/><line x1="1410" y1="727" x2="1455" y2="727" stroke="#5bdde8" stroke-width="4"/><line x1="1410" y1="738" x2="1455" y2="738" stroke="#81dba8" stroke-width="4"/><line x1="1410" y1="749" x2="1455" y2="749" stroke="#ffd263" stroke-width="4"/>
<text x="800" y="740" font-size="11" font-weight="650" fill="#b15b36">Pierre Janssen (India) &amp; Norman Lockyer (England) · Independent</text>
<text x="800" y="754" font-size="11" font-weight="650" fill="#b15b36">solar-spectroscopy observations; Janssen at Guntur and Lockyer in</text>
<text x="800" y="774" font-size="11" fill="#4e524e">Janssen and Lockyer independently detected a new yellow line in the Sun’s</text>
<text x="800" y="789" font-size="11" fill="#4e524e">spectrum. Helium was isolated on Earth in 1895.</text>
<rect x="72" y="950" width="684" height="297" rx="12" fill="#fffdf4" stroke="#2b7777" stroke-width="2"/>
<text x="92" y="984" font-size="13" font-weight="700" fill="#2b7777">1878 · isolated as an oxide</text><text x="92" y="1005" font-size="10" fill="#796f60">Yb / ATOMIC NO. </text><text x="92" y="1031" font-size="21" font-weight="750" fill="#2b3134">Ytterbium</text>
<path d="M634 1080l12-48 26-30 18 26 23-25 30 77z" fill="#385358" stroke="#81dba8" stroke-width="3"/><path d="M672 1002l8 76m29-51-15 51" stroke="#b8d9b9" stroke-width="3"/><circle cx="660" cy="1056" r="7" fill="#ffb162"/>
<text x="92" y="1055" font-size="11" font-weight="650" fill="#2b7777">Jean Charles Galissard de Marignac · Geneva, Switzerland · University</text>
<text x="92" y="1069" font-size="11" font-weight="650" fill="#2b7777">of Geneva chemical laboratory</text>
<text x="92" y="1089" font-size="11" fill="#4e524e">De Marignac separated a new oxide from erbium. The material still contained</text>
<text x="92" y="1104" font-size="11" fill="#4e524e">lutetium, which was separated in 1907.</text>
<rect x="780" y="950" width="684" height="297" rx="12" fill="#fffdf4" stroke="#b15b36" stroke-width="2"/>
<text x="800" y="984" font-size="13" font-weight="700" fill="#2b7777">1886 · first isolation</text><text x="800" y="1005" font-size="10" fill="#796f60">F / ATOMIC NO. </text><text x="800" y="1031" font-size="21" font-weight="750" fill="#2b3134">Fluorine</text>
<path d="M1353 1011v58l12 15h50l12-15v-58" fill="#17394a" stroke="#b15b36" stroke-width="4"/><path d="M1353 1046h74" stroke="#5a9aae" stroke-width="3"/><path d="M1375 994v69m30-69v69" stroke="#ffb162" stroke-width="4"/><circle cx="1370" cy="1038" r="4" fill="#dceff5"/><circle cx="1407" cy="1026" r="4" fill="#dceff5"/>
<text x="800" y="1055" font-size="11" font-weight="650" fill="#b15b36">Henri Moissan · Paris, France · École supérieure de pharmacie de Paris</text>
<text x="800" y="1089" font-size="11" fill="#4e524e">Moissan isolated F₂ by electrolysing potassium bifluoride in liquid hydrogen</text>
<text x="800" y="1104" font-size="11" fill="#4e524e">fluoride after decades of dangerous failed attempts.</text>
<rect x="72" y="1265" width="684" height="297" rx="12" fill="#fffdf4" stroke="#2b7777" stroke-width="2"/>
<text x="92" y="1299" font-size="13" font-weight="700" fill="#2b7777">1940 · first synthesis</text><text x="92" y="1320" font-size="10" fill="#796f60">At / ATOMIC NO. </text><text x="92" y="1346" font-size="21" font-weight="750" fill="#2b3134">Astatine</text>
<ellipse cx="682" cy="1357" rx="43" ry="19" fill="none" stroke="#2b7777" stroke-width="3"/><ellipse cx="682" cy="1357" rx="20" ry="43" fill="none" stroke="#b891e8" stroke-width="3" transform="rotate(35 682 1357)"/><circle cx="682" cy="1357" r="10" fill="#ffb162"/><circle cx="722" cy="1347" r="5" fill="#dceff5"/>
<text x="92" y="1370" font-size="11" font-weight="650" fill="#2b7777">Dale R. Corson, Kenneth R. MacKenzie &amp; Emilio Segrè · Berkeley, USA ·</text>
<text x="92" y="1384" font-size="11" font-weight="650" fill="#2b7777">University of California, Berkeley Radiation Laboratory</text>
<text x="92" y="1404" font-size="11" fill="#4e524e">Bombarding bismuth with alpha particles produced this extremely radioactive</text>
<text x="92" y="1419" font-size="11" fill="#4e524e">element. Only tiny quantities can be made.</text>
<rect x="780" y="1265" width="684" height="297" rx="12" fill="#fffdf4" stroke="#b15b36" stroke-width="2"/>
<text x="800" y="1299" font-size="13" font-weight="700" fill="#2b7777">1955 · first synthesis</text><text x="800" y="1320" font-size="10" fill="#796f60">Md / ATOMIC NO. </text><text x="800" y="1346" font-size="21" font-weight="750" fill="#2b3134">Mendelevium</text>
<ellipse cx="1390" cy="1357" rx="48" ry="34" fill="none" stroke="#b15b36" stroke-width="4"/><ellipse cx="1390" cy="1357" rx="31" ry="21" fill="none" stroke="#3d6f89" stroke-width="3"/><path d="M1341 1335a48 34 0 0 1 78 0" fill="none" stroke="#ffb162" stroke-width="5"/><circle cx="1424" cy="1341" r="6" fill="#ffb162"/><circle cx="1390" cy="1357" r="6" fill="#5bdde8"/>
<text x="800" y="1370" font-size="11" font-weight="650" fill="#b15b36">Albert Ghiorso, Glenn Seaborg &amp; Berkeley team · Berkeley, USA ·</text>
<text x="800" y="1384" font-size="11" font-weight="650" fill="#b15b36">University of California Radiation Laboratory; 60-inch cyclotron</text>
<text x="800" y="1404" font-size="11" fill="#4e524e">Seventeen atoms were made by bombarding einsteinium-253 with alpha particles.</text>
<text x="800" y="1419" font-size="11" fill="#4e524e">Recoil separation enabled atom-at-a-time identification.</text>
<rect x="72" y="1580" width="684" height="297" rx="12" fill="#fffdf4" stroke="#2b7777" stroke-width="2"/>
<text x="92" y="1614" font-size="13" font-weight="700" fill="#2b7777">1965 · conclusive synthesis</text><text x="92" y="1635" font-size="10" fill="#796f60">No / ATOMIC NO. </text><text x="92" y="1661" font-size="21" font-weight="750" fill="#2b3134">Nobelium</text>
<ellipse cx="682" cy="1672" rx="48" ry="34" fill="none" stroke="#2b7777" stroke-width="4"/><ellipse cx="682" cy="1672" rx="31" ry="21" fill="none" stroke="#3d6f89" stroke-width="3"/><path d="M633 1650a48 34 0 0 1 78 0" fill="none" stroke="#ffb162" stroke-width="5"/><circle cx="716" cy="1656" r="6" fill="#ffb162"/><circle cx="682" cy="1672" r="6" fill="#5bdde8"/>
<text x="92" y="1685" font-size="11" font-weight="650" fill="#2b7777">Joint Institute for Nuclear Research team · Dubna, USSR · Joint</text>
<text x="92" y="1699" font-size="11" font-weight="650" fill="#2b7777">Institute for Nuclear Research (JINR), Dubna</text>
<text x="92" y="1719" font-size="11" fill="#4e524e">After disputed 1957–58 claims, Dubna achieved a conclusive synthesis in 1965.</text>
<text x="92" y="1734" font-size="11" fill="#4e524e">The early Swedish claim was later shown to be incorrect.</text>
<rect x="780" y="1580" width="684" height="297" rx="12" fill="#fffdf4" stroke="#b15b36" stroke-width="2"/>
<text x="800" y="1614" font-size="13" font-weight="700" fill="#2b7777">2009–2010 · synthesis reported</text><text x="800" y="1635" font-size="10" fill="#796f60">Ts / ATOMIC NO. </text><text x="800" y="1661" font-size="21" font-weight="750" fill="#2b3134">Tennessine</text>
<g stroke-width="5" fill="none"><path d="M1338 1642L1385 1668" stroke="#5bdde8"/><path d="M1338 1702L1385 1676" stroke="#ffb162"/><path d="M1442 1642L1395 1668" stroke="#b891e8"/><path d="M1442 1702L1395 1676" stroke="#81dba8"/></g><circle cx="1390" cy="1672" r="11" fill="#dceff5"/><g stroke="#ffb162" stroke-width="3"><path d="M1390 1672l-28 -28"/><path d="M1390 1672l28 -28"/><path d="M1390 1672l-28 28"/><path d="M1390 1672l28 28"/><path d="M1390 1672l0 -43"/><path d="M1390 1672l0 43"/></g>
<text x="800" y="1685" font-size="11" font-weight="650" fill="#b15b36">JINR Dubna · Lawrence Livermore · Oak Ridge collaboration · JINR U-400</text>
<text x="800" y="1699" font-size="11" font-weight="650" fill="#b15b36">cyclotron; Oak Ridge and Lawrence Livermore national laboratories</text>
<text x="800" y="1719" font-size="11" fill="#4e524e">Calcium-48 ions were fused with berkelium-249. IUPAC confirmed the discovery in</text>
<text x="800" y="1734" font-size="11" fill="#4e524e">2015 and approved the name in 2016.</text>
<path d="M72 1880H1464" stroke="#c2b192" stroke-width="2"/>
<text x="72" y="1900" font-size="11" fill="#4e524e">Discovery advanced from chemical isolation and solar spectroscopy to accelerator-made nuclei through international collaboration.</text>
<text x="72" y="1922" font-size="10" fill="#796f60">Sources: Royal Society of Chemistry element histories · ACS Transuranium Elements at Berkeley Lab · IUPAC discovery and naming reports.</text>
</g></svg>