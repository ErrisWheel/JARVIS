<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="2048" viewBox="0 0 1536 2048" role="img" aria-labelledby="poster-title poster-desc">
<title id="poster-title">ELEMENT DISCOVERY &amp; PERIODIC-TABLE ORGANIZATION</title>
<desc id="poster-desc">Locally rendered timeline educational infographic with editable vector text and illustrations.</desc>
<rect width="1536" height="2048" fill="#071221"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="72" y="48" font-size="18" font-weight="700" letter-spacing="2" fill="#5bdde8">J.A.R.V.I.S. / EDUCATIONAL VISUAL SERIES</text>
<text x="72" y="112" font-size="54" font-weight="800" fill="#eff7fa">ELEMENT DISCOVERY &amp; PERIODIC-TABLE</text>
<text x="72" y="174" font-size="54" font-weight="800" fill="#eff7fa">ORGANIZATION</text>
<text x="74" y="170" font-size="22" fill="#b3cad6">10 selected elements · from 1774 to 2009–2010</text>
<text x="74" y="204" font-size="14" fill="#7895a6">Element discovery transformed chemistry: from identifying substances in minerals and gases to detecting atoms made in laboratories.</text>
<rect x="72" y="260" width="183" height="28" rx="8" fill="#0d2234" stroke="#57d3e1"/><text x="82" y="279" font-size="12" font-weight="700" fill="#57d3e1">GROUP 17 · HALOGENS · 6</text>
<rect x="265" y="260" width="190" height="28" rx="8" fill="#0d2234" stroke="#ffb964"/><text x="275" y="279" font-size="12" font-weight="700" fill="#ffb964">GROUP 18 · NOBLE GAS · 1</text>
<rect x="465" y="260" width="197" height="28" rx="8" fill="#0d2234" stroke="#7ed7a2"/><text x="475" y="279" font-size="12" font-weight="700" fill="#7ed7a2">LANTHANOIDS · f-BLOCK · 1</text>
<rect x="672" y="260" width="183" height="28" rx="8" fill="#0d2234" stroke="#ba96e8"/><text x="682" y="279" font-size="12" font-weight="700" fill="#ba96e8">ACTINOIDS · f-BLOCK · 2</text>
<path d="M118 389H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="389" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="318" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="329" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="347" font-size="13" font-weight="700" fill="#ffb162">1774 · first production</text>
<text x="192" y="372" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 17</text>
<text x="262" y="421" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">Cl</text>
<path d="M381 355h26m-7 0v34l25 38v8h-62v-8l25-38v-34" fill="#16394a" stroke="#57d3e1" stroke-width="4"/><path d="M367 412h54l14 25h-82z" fill="#397e69" opacity=".9"/><g fill="none" stroke="#dceff5" stroke-width="3"><circle cx="370" cy="349" r="5"/><circle cx="398" cy="338" r="4"/><circle cx="418" cy="350" r="6"/></g>
<text x="466" y="352" font-size="24" font-weight="750" fill="#eff7fa">Chlorine</text>
<text x="1114" y="336" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 3</text>
<text x="466" y="374" font-size="12" font-weight="650" fill="#57d3e1">Carl Wilhelm Scheele · Uppsala, Sweden · Scheele’s laboratory and pharmacy, Uppsala</text>
<text x="466" y="397" font-size="12" fill="#b3cad6">Scheele produced greenish-yellow chlorine by heating hydrochloric acid with pyrolusite. Humphry Davy later proved it was</text>
<text x="466" y="413" font-size="12" fill="#b3cad6">an element (1810).</text>
<path d="M118 540H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="540" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="469" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="480" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="498" font-size="13" font-weight="700" fill="#ffb162">1811 · first observed</text>
<text x="192" y="523" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 53</text>
<text x="262" y="572" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">I</text>
<g fill="#3d2e69" stroke="#b891e8" stroke-width="3"><path d="M352 575l8-58 18-25 8 83z"/><path d="M384 575l11-68 20-23 5 91z"/><path d="M412 575l12-42 14-10 5 52z"/></g><path d="M360 517l12 57m16-54 10 54" stroke="#d9c4ff" stroke-width="2"/>
<text x="466" y="503" font-size="24" font-weight="750" fill="#eff7fa">Iodine</text>
<text x="1114" y="487" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 5</text>
<text x="466" y="525" font-size="12" font-weight="650" fill="#57d3e1">Bernard Courtois · Paris, France · Courtois’s saltpetre works and laboratory, Paris</text>
<text x="466" y="548" font-size="12" fill="#b3cad6">Courtois saw violet vapour while processing seaweed ash. Gay-Lussac later named the element after its violet colour.</text>
<path d="M118 691H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="691" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="620" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="631" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="649" font-size="13" font-weight="700" fill="#ffb162">1826 · discovery published</text>
<text x="192" y="674" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 35</text>
<text x="262" y="723" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">Br</text>
<rect x="368" y="660" width="52" height="76" rx="10" fill="#183346" stroke="#57d3e1" stroke-width="4"/><rect x="377" y="698" width="34" height="28" rx="4" fill="#ae4e27"/><rect x="382" y="646" width="24" height="17" rx="4" fill="#dceff5"/><path d="M377 698h34" stroke="#ffb162" stroke-width="3"/>
<text x="466" y="654" font-size="24" font-weight="750" fill="#eff7fa">Bromine</text>
<text x="1114" y="638" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 4</text>
<text x="466" y="676" font-size="12" font-weight="650" fill="#57d3e1">Antoine-Jérôme Balard · Montpellier, France · University of Montpellier</text>
<text x="466" y="699" font-size="12" fill="#b3cad6">Balard identified an orange-red liquid in brine residues. Carl Löwig had independently produced a sample in 1825.</text>
<path d="M118 842H174" stroke="#ffb964" stroke-width="3"/><circle cx="118" cy="842" r="11" fill="#071221" stroke="#ffb964" stroke-width="4"/>
<rect x="174" y="771" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="782" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="800" font-size="13" font-weight="700" fill="#ffb162">1868 · solar detection</text>
<text x="192" y="825" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 2</text>
<text x="262" y="874" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">He</text>
<circle cx="384" cy="838" r="35" fill="#ffbc53" stroke="#ffb162" stroke-width="3"/><line x1="414" y1="820" x2="459" y2="820" stroke="#64aeff" stroke-width="4"/><line x1="414" y1="831" x2="459" y2="831" stroke="#b891e8" stroke-width="4"/><line x1="414" y1="842" x2="459" y2="842" stroke="#5bdde8" stroke-width="4"/><line x1="414" y1="853" x2="459" y2="853" stroke="#81dba8" stroke-width="4"/><line x1="414" y1="864" x2="459" y2="864" stroke="#ffd263" stroke-width="4"/>
<text x="466" y="805" font-size="24" font-weight="750" fill="#eff7fa">Helium</text>
<text x="1114" y="789" font-size="11" font-weight="700" fill="#ffb964">NOBLE GAS · GROUP 18 · PERIOD 1</text>
<text x="466" y="827" font-size="12" font-weight="650" fill="#ffb964">Pierre Janssen (India) &amp; Norman Lockyer (England) · Independent solar-spectroscopy observations; Janssen at Guntur and</text>
<text x="466" y="850" font-size="12" fill="#b3cad6">Janssen and Lockyer independently detected a new yellow line in the Sun’s spectrum. Helium was isolated on Earth in</text>
<text x="466" y="866" font-size="12" fill="#b3cad6">1895.</text>
<path d="M118 993H174" stroke="#7ed7a2" stroke-width="3"/><circle cx="118" cy="993" r="11" fill="#071221" stroke="#7ed7a2" stroke-width="4"/>
<rect x="174" y="922" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="933" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="951" font-size="13" font-weight="700" fill="#ffb162">1878 · isolated as an oxide</text>
<text x="192" y="976" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 70</text>
<text x="262" y="1025" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">Yb</text>
<path d="M346 1031l12-48 26-30 18 26 23-25 30 77z" fill="#385358" stroke="#81dba8" stroke-width="3"/><path d="M384 953l8 76m29-51-15 51" stroke="#b8d9b9" stroke-width="3"/><circle cx="372" cy="1007" r="7" fill="#ffb162"/>
<text x="466" y="956" font-size="24" font-weight="750" fill="#eff7fa">Ytterbium</text>
<text x="1114" y="940" font-size="11" font-weight="700" fill="#7ed7a2">LANTHANOID · F-BLOCK · PERIOD 6</text>
<text x="466" y="978" font-size="12" font-weight="650" fill="#7ed7a2">Jean Charles Galissard de Marignac · Geneva, Switzerland · University of Geneva chemical laboratory</text>
<text x="466" y="1001" font-size="12" fill="#b3cad6">De Marignac separated a new oxide from erbium. The material still contained lutetium, which was separated in 1907.</text>
<path d="M118 1144H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="1144" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="1073" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="1084" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="1102" font-size="13" font-weight="700" fill="#ffb162">1886 · first isolation</text>
<text x="192" y="1127" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 9</text>
<text x="262" y="1176" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">F</text>
<path d="M357 1113v58l12 15h50l12-15v-58" fill="#17394a" stroke="#57d3e1" stroke-width="4"/><path d="M357 1148h74" stroke="#5a9aae" stroke-width="3"/><path d="M379 1096v69m30-69v69" stroke="#ffb162" stroke-width="4"/><circle cx="374" cy="1140" r="4" fill="#dceff5"/><circle cx="411" cy="1128" r="4" fill="#dceff5"/>
<text x="466" y="1107" font-size="24" font-weight="750" fill="#eff7fa">Fluorine</text>
<text x="1114" y="1091" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 2</text>
<text x="466" y="1129" font-size="12" font-weight="650" fill="#57d3e1">Henri Moissan · Paris, France · École supérieure de pharmacie de Paris</text>
<text x="466" y="1152" font-size="12" fill="#b3cad6">Moissan isolated F₂ by electrolysing potassium bifluoride in liquid hydrogen fluoride after decades of dangerous failed</text>
<text x="466" y="1168" font-size="12" fill="#b3cad6">attempts.</text>
<path d="M118 1295H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="1295" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="1224" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="1235" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="1253" font-size="13" font-weight="700" fill="#ffb162">1940 · first synthesis</text>
<text x="192" y="1278" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 85</text>
<text x="262" y="1327" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">At</text>
<ellipse cx="394" cy="1295" rx="43" ry="19" fill="none" stroke="#57d3e1" stroke-width="3"/><ellipse cx="394" cy="1295" rx="20" ry="43" fill="none" stroke="#b891e8" stroke-width="3" transform="rotate(35 394 1295)"/><circle cx="394" cy="1295" r="10" fill="#ffb162"/><circle cx="434" cy="1285" r="5" fill="#dceff5"/>
<text x="466" y="1258" font-size="24" font-weight="750" fill="#eff7fa">Astatine</text>
<text x="1114" y="1242" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 6</text>
<text x="466" y="1280" font-size="12" font-weight="650" fill="#57d3e1">Dale R. Corson, Kenneth R. MacKenzie &amp; Emilio Segrè · Berkeley, USA · University of California, Berkeley Radiation</text>
<text x="466" y="1303" font-size="12" fill="#b3cad6">Bombarding bismuth with alpha particles produced this extremely radioactive element. Only tiny quantities can be made.</text>
<path d="M118 1446H174" stroke="#ba96e8" stroke-width="3"/><circle cx="118" cy="1446" r="11" fill="#071221" stroke="#ba96e8" stroke-width="4"/>
<rect x="174" y="1375" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="1386" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="1404" font-size="13" font-weight="700" fill="#ffb162">1955 · first synthesis</text>
<text x="192" y="1429" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 101</text>
<text x="262" y="1478" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">Md</text>
<ellipse cx="394" cy="1446" rx="48" ry="34" fill="none" stroke="#ba96e8" stroke-width="4"/><ellipse cx="394" cy="1446" rx="31" ry="21" fill="none" stroke="#3d6f89" stroke-width="3"/><path d="M345 1424a48 34 0 0 1 78 0" fill="none" stroke="#ffb162" stroke-width="5"/><circle cx="428" cy="1430" r="6" fill="#ffb162"/><circle cx="394" cy="1446" r="6" fill="#5bdde8"/>
<text x="466" y="1409" font-size="24" font-weight="750" fill="#eff7fa">Mendelevium</text>
<text x="1114" y="1393" font-size="11" font-weight="700" fill="#ba96e8">ACTINOID · F-BLOCK · PERIOD 7</text>
<text x="466" y="1431" font-size="12" font-weight="650" fill="#ba96e8">Albert Ghiorso, Glenn Seaborg &amp; Berkeley team · Berkeley, USA · University of California Radiation Laboratory; 60-inch</text>
<text x="466" y="1454" font-size="12" fill="#b3cad6">Seventeen atoms were made by bombarding einsteinium-253 with alpha particles. Recoil separation enabled atom-at-a-time</text>
<text x="466" y="1470" font-size="12" fill="#b3cad6">identification.</text>
<path d="M118 1597H174" stroke="#ba96e8" stroke-width="3"/><circle cx="118" cy="1597" r="11" fill="#071221" stroke="#ba96e8" stroke-width="4"/>
<rect x="174" y="1526" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="1537" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="1555" font-size="13" font-weight="700" fill="#ffb162">1965 · conclusive synthesis</text>
<text x="192" y="1580" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 102</text>
<text x="262" y="1629" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">No</text>
<ellipse cx="394" cy="1597" rx="48" ry="34" fill="none" stroke="#ba96e8" stroke-width="4"/><ellipse cx="394" cy="1597" rx="31" ry="21" fill="none" stroke="#3d6f89" stroke-width="3"/><path d="M345 1575a48 34 0 0 1 78 0" fill="none" stroke="#ffb162" stroke-width="5"/><circle cx="428" cy="1581" r="6" fill="#ffb162"/><circle cx="394" cy="1597" r="6" fill="#5bdde8"/>
<text x="466" y="1560" font-size="24" font-weight="750" fill="#eff7fa">Nobelium</text>
<text x="1114" y="1544" font-size="11" font-weight="700" fill="#ba96e8">ACTINOID · F-BLOCK · PERIOD 7</text>
<text x="466" y="1582" font-size="12" font-weight="650" fill="#ba96e8">Joint Institute for Nuclear Research team · Dubna, USSR · Joint Institute for Nuclear Research (JINR), Dubna</text>
<text x="466" y="1605" font-size="12" fill="#b3cad6">After disputed 1957–58 claims, Dubna achieved a conclusive synthesis in 1965. The early Swedish claim was later shown to</text>
<text x="466" y="1621" font-size="12" fill="#b3cad6">be incorrect.</text>
<path d="M118 1748H174" stroke="#57d3e1" stroke-width="3"/><circle cx="118" cy="1748" r="11" fill="#071221" stroke="#57d3e1" stroke-width="4"/>
<rect x="174" y="1677" width="1290" height="143" rx="16" fill="#0d2234" stroke="#264c60" stroke-width="2"/>
<rect x="192" y="1688" width="160" height="26" rx="8" fill="#194353"/><text x="202" y="1706" font-size="13" font-weight="700" fill="#ffb162">2009–2010 · synthesis reported</text>
<text x="192" y="1731" font-size="10" font-weight="700" fill="#7895a6">ATOMIC NO. 117</text>
<text x="262" y="1780" text-anchor="middle" font-size="42" font-weight="800" fill="#eff7fa">Ts</text>
<g stroke-width="5" fill="none"><path d="M342 1718L389 1744" stroke="#5bdde8"/><path d="M342 1778L389 1752" stroke="#ffb162"/><path d="M446 1718L399 1744" stroke="#b891e8"/><path d="M446 1778L399 1752" stroke="#81dba8"/></g><circle cx="394" cy="1748" r="11" fill="#dceff5"/><g stroke="#ffb162" stroke-width="3"><path d="M394 1748l-28 -28"/><path d="M394 1748l28 -28"/><path d="M394 1748l-28 28"/><path d="M394 1748l28 28"/><path d="M394 1748l0 -43"/><path d="M394 1748l0 43"/></g>
<text x="466" y="1711" font-size="24" font-weight="750" fill="#eff7fa">Tennessine</text>
<text x="1114" y="1695" font-size="11" font-weight="700" fill="#57d3e1">HALOGEN · GROUP 17 · PERIOD 7</text>
<text x="466" y="1733" font-size="12" font-weight="650" fill="#57d3e1">JINR Dubna · Lawrence Livermore · Oak Ridge collaboration · JINR U-400 cyclotron; Oak Ridge and Lawrence Livermore</text>
<text x="466" y="1756" font-size="12" fill="#b3cad6">Calcium-48 ions were fused with berkelium-249. IUPAC confirmed the discovery in 2015 and approved the name in 2016.</text>
<path d="M72 1900H1464" stroke="#2a596e" stroke-width="2"/>
<text x="72" y="1924" font-size="12" fill="#b3cad6">Discovery advanced from chemical isolation and solar spectroscopy to accelerator-made nuclei through international collaboration.</text>
<text x="72" y="2009" font-size="10" fill="#7895a6">Sources: Royal Society of Chemistry element histories · ACS Transuranium Elements at Berkeley Lab · IUPAC discovery and naming reports.</text>
</g></svg>