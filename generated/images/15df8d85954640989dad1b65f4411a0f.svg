<title id="poster-title">ELEMENT DISCOVERY &amp; PERIODIC-TABLE ORGANIZATION</title>
<desc id="poster-desc">Locally rendered orbit educational infographic with editable vector text and illustrations.</desc>
<rect width="1536" height="2048" fill="#f5f1e6"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="72" y="48" font-size="18" font-weight="700" letter-spacing="2" fill="#1f7784">J.A.R.V.I.S. / EDUCATIONAL VISUAL SERIES</text>
<text x="72" y="112" font-size="54" font-weight="800" fill="#1f313d">ELEMENT DISCOVERY &amp; PERIODIC-TABLE</text>
<text x="72" y="174" font-size="54" font-weight="800" fill="#1f313d">ORGANIZATION</text>
<text x="74" y="170" font-size="22" fill="#43535b">10 selected elements · from 1774 to 2009–2010</text>
<text x="74" y="204" font-size="14" fill="#677376">Element discovery transformed chemistry: from identifying substances in minerals and gases to detecting atoms made in laboratories.</text>
<rect x="72" y="260" width="183" height="28" rx="8" fill="#fdfaF2" stroke="#57b8c7"/><text x="82" y="279" font-size="12" font-weight="700" fill="#57b8c7">GROUP 17 · HALOGENS · 6</text>
<rect x="265" y="260" width="190" height="28" rx="8" fill="#fdfaF2" stroke="#bb7a31"/><text x="275" y="279" font-size="12" font-weight="700" fill="#bb7a31">GROUP 18 · NOBLE GAS · 1</text>
<rect x="465" y="260" width="197" height="28" rx="8" fill="#fdfaF2" stroke="#428b5d"/><text x="475" y="279" font-size="12" font-weight="700" fill="#428b5d">LANTHANOIDS · f-BLOCK · 1</text>
<rect x="672" y="260" width="183" height="28" rx="8" fill="#fdfaF2" stroke="#825da4"/><text x="682" y="279" font-size="12" font-weight="700" fill="#825da4">ACTINOIDS · f-BLOCK · 2</text>
<path d="M768 370V1747" stroke="#b3a48c" stroke-width="5"/>
